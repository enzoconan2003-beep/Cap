<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Reel app icon: squircle + indigo gradient + white R + accent dot -->
  <defs>
    <!-- macOS Big Sur squircle path (superellipse), corner radius ~22.37% of side -->
    <clipPath id="squircle">
      <path d="M512,0
               C 226.7,0 0,226.7 0,512
               C 0,797.3 226.7,1024 512,1024
               C 797.3,1024 1024,797.3 1024,512
               C 1024,226.7 797.3,0 512,0 Z"
            transform="matrix(1,0,0,1,0,0)"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="55%" stop-color="#6a48ee"/>
      <stop offset="100%" stop-color="#5236d4"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle approximated with rounded rect (rx 230 ~= 22.5%) for clean rendering at all sizes -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#sheen)"/>

  <!-- White "R" wordmark, modern sans, centered -->
  <g filter="url(#softShadow)">
    <text x="512" y="512"
          font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="700"
          font-weight="800"
          fill="#ffffff"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="-30">R</text>
  </g>

  <!-- Accent dot (the "•" from the in-app "Reel •" wordmark) -->
  <circle cx="770" cy="700" r="46" fill="#8b6dff"/>
</svg>
